# =============================================================================
# polars-pycountry — Rust crate for the Polars expression plugin.
#
# The compiled cdylib is BOTH a Polars plugin (dlopen'd by polars via
# `register_plugin_function`, C-ABI symbols emitted by `#[polars_expr]`) and a
# regular Python extension module (`polars_pycountry._internal`, for the scalar
# helpers). maturin packages it as the latter.
# =============================================================================

[package]
name = "polars-pycountry"
version = "0.1.1"
edition = "2021"
description = "Vectorized, pycountry-compatible ISO 3166 / 4217 code lookup for Polars."
license = "MIT OR Apache-2.0"
repository = "https://github.com/andrewadlof/polars-pycountry"
keywords = ["polars", "pycountry", "iso3166", "country", "subdivision"]
categories = ["internationalization", "data-structures"]
# The crate is not published to crates.io: it is a cdylib whose only
# consumer is the Python wheel. Depend on the PyPI package instead.
publish = false

[lib]
name = "_internal"
crate-type = ["cdylib", "rlib"]

[dependencies]
# pyo3 0.29 is what pyo3-polars 0.28 pins. abi3-py310 gives one wheel per
# platform covering Python 3.10+, matching polars' own floor.
# `extension-module` is deliberately NOT enabled here -- it tells pyo3 not to
# link libpython, which is right for the wheel but leaves `cargo test`'s test
# binary with unresolved symbols. maturin turns it on via `[tool.maturin]
# features` when it builds the wheel.
# `generate-import-lib` synthesizes the `python3` import library at build time
# rather than requiring one from a real interpreter install, which is what the
# Windows arm64 cross-build needs -- the runner is x64 and has no arm64 Python.
pyo3 = { version = "0.29", features = ["abi3-py310", "generate-import-lib"] }
# pyo3-polars 0.28 <-> polars-rs 0.55.1 <-> py-polars 1.44.x. The plugin FFI ABI
# is (0, 1) and unchanged since py-polars 1.37, so one build spans the whole
# `polars>=1.37.1` range the consuming projects pin. The Rust pin trailing the
# py-polars the tests run against is expected and fine -- what has to agree is
# the ABI, not the version, and tests/test_abi.py asserts exactly that.
pyo3-polars = { version = "0.28", features = ["derive", "dtype-struct"] }
polars = { version = "0.55.1", default-features = false, features = [
  "dtype-struct",
] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` is load-bearing, not cosmetic: pycountry's `lookup()` walks
# its field indices in the order the fields were first seen in the JSON, and
# returns the first hit. Reproducing that order requires reading the objects
# with their keys in file order, which is what this feature (an IndexMap-backed
# `serde_json::Map`) provides.
serde_json = { version = "1", features = ["preserve_order"] }
# NFKD plus canonical-combining-class, which is exactly what pycountry's
# `remove_accents` does with `unicodedata`.
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
